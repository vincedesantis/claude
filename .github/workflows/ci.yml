name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          # Dummy values so build-time env checks pass — no real
          # network calls happen during `next build`, only during
          # requests to the API routes at runtime.
          FINNHUB_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          RESEND_API_KEY: ci-placeholder
          RESEND_FROM_EMAIL: ci@example.com
          DIGEST_TO_EMAIL: ci@example.com
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          CRON_SECRET: ci-placeholder
